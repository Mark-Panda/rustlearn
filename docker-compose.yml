version: '3'
services:
  nacos:
    image: qingpan/rnacos:stable
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "10848:10848"
    volumes:
      - ./volumes/nacos_data:/io:rw
    environment: # http://localhost:10848/rnacos/
      - RNACOS_INIT_ADMIN_USERNAME=admin
      - RNACOS_INIT_ADMIN_PASSWORD=admin
      - RNACOS_HTTP_PORT=8848
    restart: always
  postgres-db:
    image: postgres:latest
    container_name: postgresDB-server
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: rust
      POSTGRES_PASSWORD: rust
    volumes:
      - ./volumes/database_postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    container_name: redisCache-server
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    hostname: redis
    volumes:
      - ./volumes/database_redis-data:/data
    ports:
      - '6379:6379'
  postgres-pgvector:
    image: ankane/pgvector:latest
    container_name: pgvector-server
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgvector
    volumes:
      - ./volumes/database_pgvector-data:/var/lib/postgresql/data
networks:
  rust:
    ipam:
      config:
        - subnet: 192.100.0.0/16
