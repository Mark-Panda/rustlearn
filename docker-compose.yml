version: '3'
services:
  postgres-db:
    image: postgres:latest
    container_name: postgresDB-server
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: rust
      POSTGRES_PASSWORD: rust
    volumes:
      - ./volumes/database_postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    container_name: redisCache-server
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    hostname: redis
    volumes:
      - ./volumes/database_redis-data:/data
    ports:
      - '6379:6379'
  nacos:
      image: qingpan/rnacos:stable
      container_name: nacos
      ports:
        - "8848:8848"
        - "9848:9848"
        - "10848:10848"
      volumes:
        - ./volumes/nacos-data:/io:rw
      environment:
        - RNACOS_INIT_ADMIN_USERNAME=admin
        - RNACOS_INIT_ADMIN_PASSWORD=admin
        - RNACOS_HTTP_PORT=8848
      restart: always
networks:
  rust:
    ipam:
      config:
        - subnet: 192.100.0.0/16
