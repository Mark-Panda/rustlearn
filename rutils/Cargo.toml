[package]
name = "rutils"
version = "1.0.0"
edition = "2021"

[dependencies]
tonic = "0.12.3"
anyhow = "1.0.95"
async-trait = "0.1.83"
axum = { version = "0.8.1", features = ["tower-log"] }
lazy_static = "1.5.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
sqlx = { version = "0.8.2", features = [
    "runtime-tokio",
    "postgres",
    "time",
    "uuid",
] }
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["full"] }
tower = { version = "0.5.2", features = ["timeout", "buffer", "limit"] }
tracing = "0.1.41"
redis = { version = "0.28.1", features = [
    "cluster-async",
    "async-std-comp",
    "aio",
] }
validator = { version = "0.19.0", features = ["derive"] }
